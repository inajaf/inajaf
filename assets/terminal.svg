<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Terminal intro">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a26"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <filter id="g" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="220" rx="14" fill="url(#panel)" stroke="rgba(148,163,184,0.18)"/>
  <rect x="1" y="1" width="898" height="36" rx="14" fill="rgba(148,163,184,0.05)"/>
  <circle cx="24" cy="19" r="5" fill="#fb7185"/>
  <circle cx="42" cy="19" r="5" fill="#fbbf24"/>
  <circle cx="60" cy="19" r="5" fill="#00ADD8"/>
  <text x="450" y="23" text-anchor="middle" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="12" fill="#8b96ad">inajaf - session</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">
    <text x="28" y="72" fill="#8b96ad">$</text>
    <text x="48" y="72" fill="#7dd3e8">whoami</text>
    <text x="28" y="98" fill="#e6edf3">Eldar Najafov · Software Engineer</text>

    <text x="28" y="130" fill="#8b96ad">$</text>
    <text x="48" y="130" fill="#7dd3e8">cat mission.txt</text>
    <text x="28" y="156" fill="#94a3b8">Build systems that are fast, clear, and a little cinematic.</text>

    <text x="28" y="188" fill="#8b96ad">$</text>
    <text x="48" y="188" fill="#7dd3e8">focus --now</text>
    <text x="160" y="188" fill="#00ADD8" filter="url(#g)">Go · distributed systems · desktop HUD · learning tools</text>
    <rect x="820" y="176" width="9" height="16" fill="#00ADD8">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-label="Featured systems">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121a26"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ADD8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0090b4" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- frame -->
  <rect width="900" height="420" rx="16" fill="url(#panel)" stroke="rgba(148,163,184,0.16)"/>
  <rect x="1" y="1" width="898" height="42" rx="16" fill="rgba(148,163,184,0.04)"/>
  <circle cx="22" cy="22" r="4" fill="#00ADD8">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="36" y="26" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="12" fill="#8b96ad" letter-spacing="1.5">FEATURED SYSTEMS</text>
  <text x="870" y="26" text-anchor="end" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="11" fill="#00ADD8">4 ACTIVE</text>
  <line x1="16" y1="48" x2="884" y2="48" stroke="url(#accent)" stroke-width="1"/>

  <!-- row helper: y positions 64, 148, 232, 316 -->

  <!-- pulsebar -->
  <a href="https://github.com/inajaf/pulsebar">
    <rect x="16" y="60" width="868" height="72" rx="12" fill="rgba(13,19,33,0.55)" stroke="rgba(0,173,216,0.18)"/>
    <rect x="16" y="60" width="4" height="72" rx="2" fill="#00ADD8" filter="url(#glow)"/>
    <text x="40" y="88" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="11" fill="#00ADD8" letter-spacing="1">01</text>
    <text x="72" y="90" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">pulsebar</text>
    <rect x="760" y="74" width="100" height="22" rx="6" fill="rgba(0,173,216,0.10)" stroke="rgba(0,173,216,0.30)"/>
    <text x="810" y="89" text-anchor="middle" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="10" fill="#7dd3e8">DESKTOP</text>
    <text x="72" y="114" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b96ad">Glass HUD system monitor for macOS - CPU, GPU, RAM, Disk gauges</text>
  </a>

  <!-- go-professional -->
  <a href="https://github.com/inajaf/go-professional">
    <rect x="16" y="144" width="868" height="72" rx="12" fill="rgba(13,19,33,0.55)" stroke="rgba(93,201,226,0.16)"/>
    <rect x="16" y="144" width="4" height="72" rx="2" fill="#5dc9e2"/>
    <text x="40" y="172" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="11" fill="#5dc9e2" letter-spacing="1">02</text>
    <text x="72" y="174" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">go-professional</text>
    <rect x="760" y="158" width="100" height="22" rx="6" fill="rgba(93,201,226,0.10)" stroke="rgba(93,201,226,0.30)"/>
    <text x="810" y="173" text-anchor="middle" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="10" fill="#7dd3e8">COURSE</text>
    <text x="72" y="198" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b96ad">Interactive production Go &amp; distributed systems - live lessons</text>
  </a>

  <!-- learn-and-go -->
  <a href="https://github.com/inajaf/learn-and-go">
    <rect x="16" y="228" width="868" height="72" rx="12" fill="rgba(13,19,33,0.55)" stroke="rgba(61,141,181,0.16)"/>
    <rect x="16" y="228" width="4" height="72" rx="2" fill="#3d8db5"/>
    <text x="40" y="256" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="11" fill="#3d8db5" letter-spacing="1">03</text>
    <text x="72" y="258" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">learn-and-go</text>
    <rect x="760" y="242" width="100" height="22" rx="6" fill="rgba(61,141,181,0.10)" stroke="rgba(61,141,181,0.30)"/>
    <text x="810" y="257" text-anchor="middle" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="10" fill="#b3d7e6">LAB</text>
    <text x="72" y="282" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b96ad">Hands-on Go path: gRPC, concurrency, APIs, production patterns</text>
  </a>

  <!-- video-enhance -->
  <a href="https://github.com/inajaf/video-enhance">
    <rect x="16" y="312" width="868" height="72" rx="12" fill="rgba(13,19,33,0.55)" stroke="rgba(148,163,184,0.14)"/>
    <rect x="16" y="312" width="4" height="72" rx="2" fill="#94a3b8"/>
    <text x="40" y="340" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="11" fill="#94a3b8" letter-spacing="1">04</text>
    <text x="72" y="342" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700" fill="#e6edf3">video-enhance</text>
    <rect x="760" y="326" width="100" height="22" rx="6" fill="rgba(148,163,184,0.08)" stroke="rgba(148,163,184,0.25)"/>
    <text x="810" y="341" text-anchor="middle" font-family="ui-monospace, Menlo, Monaco, monospace" font-size="10" fill="#cbd5e1">LOCAL AI</text>
    <text x="72" y="366" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b96ad">Privacy-first video cleanup &amp; AI upscaling on your machine</text>
  </a>
</svg>

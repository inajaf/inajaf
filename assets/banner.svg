<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Eldar Najafov - Software Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="45%" stop-color="#0f1724"/>
      <stop offset="100%" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="aurora1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ADD8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0090b4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#5dc9e2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3d8db5" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00ADD8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e6edf3"/>
      <stop offset="55%" stop-color="#e6edf3"/>
      <stop offset="100%" stop-color="#7dd3e8"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00ADD8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00ADD8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#00ADD8" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0090b4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <clipPath id="frame">
      <rect x="0" y="0" width="1200" height="360" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <!-- aurora blobs -->
    <ellipse cx="280" cy="80" rx="320" ry="120" fill="url(#aurora1)" opacity="0.9"/>
    <ellipse cx="920" cy="280" rx="360" ry="140" fill="url(#aurora2)" opacity="0.9"/>

    <!-- outer HUD frame -->
    <rect x="18" y="18" width="1164" height="324" rx="14" fill="none" stroke="#94a3b8" stroke-opacity="0.18" stroke-width="1"/>
    <rect x="28" y="28" width="1144" height="304" rx="10" fill="none" stroke="#00ADD8" stroke-opacity="0.22" stroke-width="1"/>

    <!-- corner brackets -->
    <g stroke="#00ADD8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9" filter="url(#softGlow)">
      <path d="M48 78 V48 H78"/>
      <path d="M1152 78 V48 H1122"/>
      <path d="M48 282 V312 H78"/>
      <path d="M1152 282 V312 H1122"/>
    </g>

    <!-- status bar -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#8b96ad">
      <circle cx="62" cy="58" r="4" fill="#00ADD8">
        <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <text x="74" y="62">SYS.ONLINE</text>
      <text x="180" y="62" fill="#00ADD8" fill-opacity="0.85">// PROFILE.v1</text>
      <text x="980" y="62" text-anchor="end">NODE: GITHUB</text>
      <text x="1138" y="62" text-anchor="end" fill="#7dd3e8">INAJAF</text>
    </g>

    <!-- left accent bar -->
    <rect x="48" y="100" width="3" height="150" rx="2" fill="url(#scan)">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
    </rect>

    <!-- main title -->
    <text x="72" y="168" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="54" font-weight="700" fill="url(#titleGrad)" letter-spacing="-1.2">Eldar Najafov</text>
    <text x="72" y="210" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" fill="#00ADD8" letter-spacing="3">SOFTWARE ENGINEER  ·  SYSTEMS  ·  GO</text>

    <!-- subtitle chips -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">
      <rect x="72" y="240" width="118" height="28" rx="8" fill="rgba(0,173,216,0.10)" stroke="#00ADD8" stroke-opacity="0.35"/>
      <text x="131" y="258" text-anchor="middle" fill="#9adceb">Go / gRPC</text>

      <rect x="202" y="240" width="150" height="28" rx="8" fill="rgba(0,144,180,0.10)" stroke="#3d8db5" stroke-opacity="0.35"/>
      <text x="277" y="258" text-anchor="middle" fill="#b3d7e6">Distributed</text>

      <rect x="364" y="240" width="140" height="28" rx="8" fill="rgba(93,201,226,0.10)" stroke="#5dc9e2" stroke-opacity="0.35"/>
      <text x="434" y="258" text-anchor="middle" fill="#a8d9ea">Desktop HUD</text>

      <rect x="516" y="240" width="130" height="28" rx="8" fill="rgba(0,173,216,0.08)" stroke="#94a3b8" stroke-opacity="0.25"/>
      <text x="581" y="258" text-anchor="middle" fill="#94a3b8">Open Source</text>
    </g>

    <!-- right HUD panel -->
    <g transform="translate(820, 95)">
      <rect x="0" y="0" width="300" height="180" rx="12" fill="rgba(13,19,33,0.55)" stroke="rgba(148,163,184,0.18)"/>
      <text x="18" y="28" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#8b96ad" letter-spacing="1.5">TELEMETRY</text>

      <!-- mini gauges -->
      <g transform="translate(30, 55)">
        <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="6"/>
        <circle cx="40" cy="40" r="34" fill="none" stroke="#00ADD8" stroke-width="6" stroke-linecap="round"
                stroke-dasharray="160" stroke-dashoffset="42" transform="rotate(-90 40 40)"/>
        <text x="40" y="36" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#e6edf3" font-weight="700">GO</text>
        <text x="40" y="52" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8b96ad">CORE</text>
      </g>

      <g transform="translate(115, 55)">
        <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="6"/>
        <circle cx="40" cy="40" r="34" fill="none" stroke="#5dc9e2" stroke-width="6" stroke-linecap="round"
                stroke-dasharray="160" stroke-dashoffset="58" transform="rotate(-90 40 40)"/>
        <text x="40" y="36" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#e6edf3" font-weight="700">gRPC</text>
        <text x="40" y="52" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8b96ad">SVC</text>
      </g>

      <g transform="translate(200, 55)">
        <circle cx="40" cy="40" r="34" fill="none" stroke="rgba(148,163,184,0.12)" stroke-width="6"/>
        <circle cx="40" cy="40" r="34" fill="none" stroke="#3d8db5" stroke-width="6" stroke-linecap="round"
                stroke-dasharray="160" stroke-dashoffset="70" transform="rotate(-90 40 40)"/>
        <text x="40" y="36" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#e6edf3" font-weight="700">UI</text>
        <text x="40" y="52" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="10" fill="#8b96ad">HUD</text>
      </g>

      <text x="18" y="162" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#7dd3e8">▸ building tools that feel alive</text>
    </g>

    <!-- bottom scanline -->
    <rect x="48" y="318" width="1104" height="1" fill="#00ADD8" opacity="0.25"/>
    <rect x="48" y="318" width="180" height="1" fill="#00ADD8" opacity="0.9">
      <animate attributeName="x" values="48;972;48" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
